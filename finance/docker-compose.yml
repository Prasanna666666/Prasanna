# Finance: offline, encrypted, and split by trust level.
#
#   app     - assistant + UI + encrypted database. Internal network (no internet). It opens no files: the Documents service (../library) reads every file and mail.
#   gateway / ollama / library bridges - dumb byte forwarders (UI on 127.0.0.1 only; Ollama and the Documents service on your Mac).
#
# Start with ./scripts/up.sh (it keeps the database key in the macOS Keychain and passes it to the app as an environment variable: Docker cannot give a secret to a read-only container).
# Prereq (Mac): Ollama installed natively and `ollama pull ministral-3:3b` (needs internet once).
name: finance

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp"]
  restart: unless-stopped

services:
  app:
    <<: *hardened
    build: {context: .., dockerfile: finance/Dockerfile, target: app}
    image: finance:local
    environment:
      OLLAMA_HOST: http://ollama.internal:11434   # Ollama refuses other names with HTTP 403; '.internal' names are accepted
      ORBIT_INBOX: /inbox
      PLATFORM_KEY: ${PLATFORM_KEY:-}   # the apps sign their calls to each other (from the Keychain, by up.sh)
      LIBRARY_URL: http://library.internal:8502   # the Documents service reads every file and mail; Finance takes the documents that matter here
      ORBIT_TOKEN: ${ORBIT_TOKEN:-}   # the web token from up.sh; empty = no token required (development only)
      ORBIT_DB_KEY: ${ORBIT_DB_KEY:?run ./scripts/up.sh (it reads the key from the Keychain)}   # passed from the Keychain by up.sh
    volumes:
      - orbit-data:/data
      - ${HOME}/OrbitInbox:/inbox:ro
    networks: [private]
    depends_on: [ollama, library]
    mem_limit: 1g

  gateway:
    <<: *hardened
    image: alpine/socat:1.8.0.0
    command: TCP-LISTEN:8501,fork,reuseaddr TCP:app:8501
    ports: ["127.0.0.1:8501:8501"]
    networks: [private, default]
    depends_on: [app]

  library:   # forwards ONLY to the Documents service on this Mac (port 8502)
    <<: *hardened
    image: alpine/socat:1.8.0.0
    command: TCP-LISTEN:8502,fork,reuseaddr TCP:host.docker.internal:8502
    networks:
      private: {aliases: [library.internal]}
      default: {}

  ollama:   # named `ollama` so the app finds it; forwards ONLY to Ollama on the Mac
    <<: *hardened
    image: alpine/socat:1.8.0.0
    command: TCP-LISTEN:11434,fork,reuseaddr TCP:host.docker.internal:11434
    networks:
      private: {aliases: [ollama.internal]}
      default: {}

networks:
  private: {internal: true}

volumes:
  orbit-data:
    name: orbit_orbit-data   # the volume that already holds your database keeps its name, so it is found again

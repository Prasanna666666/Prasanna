name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orbit
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install -e ".[secure,parse,dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest -q --cov=orbit --cov-fail-under=85
  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orbit
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[secure,parse]" bandit pip-audit cyclonedx-bom
      - run: bandit -q -r src -c pyproject.toml
      - run: pip-audit
      - run: cyclonedx-py environment -o sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: orbit/sbom.json
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

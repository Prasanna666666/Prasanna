name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finance
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e "../kit[secure]" -e ".[secure,dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest -q --cov=finance --cov-fail-under=85
  kit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[secure,dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest -q
  images:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: images
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e "../kit[secure]" -e ".[dev]"  # the encryption tests need SQLCipher
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest -q
  library:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: library
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr
      - run: pip install -e "../kit[secure]" -e "../images" -e "../finance" -e ".[parse,dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest -q
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes eslint@10.1.0 src/finance/static
      - run: npx --yes prettier@3.8.1 --check src/finance/static
      - run: npx --yes eslint@10.1.0 ../library/src/library/static
      - run: npx --yes prettier@3.8.1 --check ../design
      - run: npx --yes prettier@3.8.1 --check ../library/src/library/static
  atlas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atlas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -e "../kit" -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest -q
      - run: npx --yes eslint@10.1.0 src/atlas/static
      - run: npx --yes prettier@3.8.1 --check src/atlas/static
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e "../kit[secure]" -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest -q
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install SQLCipher and build its Python binding from source (no macOS wheel exists)
        run: |
          brew install sqlcipher
          prefix="$(brew --prefix sqlcipher)"
          export CFLAGS="-I$prefix/include -I$prefix/include/sqlcipher"
          export LDFLAGS="-L$prefix/lib"
          pip install sqlcipher3
      - run: pip install -e kit -e "core[dev]"
      - name: Swift app builds and its tests pass (including the real Swift launcher and client against the real Core)
        working-directory: app
        run: |
          swift --version
          swift build
          ATLAS_CI_PYTHON="$(which python)" swift test
      - name: Core tests on macOS
        working-directory: core
        run: pytest -q -p no:cacheprovider
  macos-mlx:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the real MLX library and a small public model (downloaded OUTSIDE the sandbox)
        run: |
          pip install -e kit -e "core[dev]" mlx-lm huggingface_hub
          python -c "from huggingface_hub import snapshot_download; print(snapshot_download('mlx-community/SmolLM-135M-Instruct-4bit', local_dir='/tmp/atlas-model'))"
          ls -la /tmp/atlas-model
      - name: Diagnose the worker under the read-restricted profile (stderr and kernel sandbox denials)
        continue-on-error: true
        working-directory: core
        run: |
          cat > /tmp/diag_worker.py <<'PY'
          import collections, os, re, subprocess, sys
          trace = "/tmp/trace.sb"
          if os.path.exists(trace):
              os.unlink(trace)
          code = "import mlx.core as mx, mlx_lm, atlas_core.worker; from mlx_lm import load; load('/tmp/atlas-model'); print('alive')"
          done = subprocess.run(["/usr/bin/sandbox-exec", "-p", '(version 1)(trace "/tmp/trace.sb")', sys.executable, "-c", code], capture_output=True, timeout=120)
          print("traced run rc", done.returncode, done.stdout.decode().strip()[-80:], done.stderr.decode()[-200:].replace("\n", " | "))
          text = open(trace).read() if os.path.exists(trace) else ""
          roots = collections.Counter()
          for op, path in re.findall(r'\(allow (file-read[a-z-]*|process-exec[a-z*]*) \((?:literal|subpath) "([^"]+)"\)', text):
              if op == "file-read-data" or op.startswith("process-exec"):
                  parts = path.split("/")
                  roots[(op[:12], "/".join(parts[:5]))] += 1
          for (op, root), n in sorted(roots.items()):
              print(op, root, n)
          PY
          python /tmp/diag_worker.py > /tmp/diag.out 2>&1 || true
      - name: Real MLX inference inside the sandboxed worker
        working-directory: core
        env:
          ATLAS_MLX_MODEL_DIR: /tmp/atlas-model
        run: pytest -q -p no:cacheprovider tests/test_mlx_native.py tests/test_isolated.py
      - name: Worker diagnostic summary
        if: always()
        run: head -70 /tmp/diag.out | cut -c1-200 || true
  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e "../kit[secure]" -e ".[secure]" -e "../library[parse]" bandit pip-audit cyclonedx-bom
      - run: bandit -q -r src ../kit/src ../library/src -c pyproject.toml
      - run: bandit -q -r ../images/src -c ../images/pyproject.toml -ll
      - run: pip-audit
      - run: cyclonedx-py environment -o sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: finance/sbom.json
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

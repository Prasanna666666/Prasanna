name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finance
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e "../kit[secure]" -e ".[secure,dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest -q --cov=finance --cov-fail-under=85
  kit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[secure,dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest -q
  images:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: images
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e "../kit[secure]" -e ".[dev]"  # the encryption tests need SQLCipher
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest -q
  library:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: library
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr
      - run: pip install -e "../kit[secure]" -e "../images" -e "../finance" -e ".[parse,dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest -q
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes eslint@10.1.0 src/finance/static
      - run: npx --yes prettier@3.8.1 --check src/finance/static
      - run: npx --yes eslint@10.1.0 ../library/src/library/static
      - run: npx --yes prettier@3.8.1 --check ../design
      - run: npx --yes prettier@3.8.1 --check ../library/src/library/static
  atlas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atlas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -e "../kit" -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest -q
      - run: npx --yes eslint@10.1.0 src/atlas/static
      - run: npx --yes prettier@3.8.1 --check src/atlas/static
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e "../kit[secure]" -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - name: Tests (log and JUnit report saved for the artefact scan)
        run: |
          mkdir -p ../artefacts
          pytest -q --junitxml=../artefacts/junit-${{ matrix.python }}.xml 2>&1 | tee ../artefacts/pytest-${{ matrix.python }}.log
      - name: Scan the test artefacts for personal-content sentinels
        run: python tools/scan_artefacts.py ../artefacts
      - uses: actions/upload-artifact@v4
        with:
          name: core-test-artefacts-${{ matrix.python }}
          path: artefacts
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install SQLCipher and build its Python binding from source (no macOS wheel exists)
        run: |
          brew install sqlcipher
          prefix="$(brew --prefix sqlcipher)"
          export CFLAGS="-I$prefix/include -I$prefix/include/sqlcipher"
          export LDFLAGS="-L$prefix/lib"
          pip install sqlcipher3
      - run: pip install -e kit -e "core[dev]"
      - name: Swift app builds and its tests pass (including the real Swift launcher and client against the real Core)
        working-directory: app
        run: |
          swift --version
          swift build
          ATLAS_CI_PYTHON="$(which python)" swift test
      - name: Core tests on macOS
        working-directory: core
        run: pytest -q -p no:cacheprovider
  macos-mlx:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the real MLX library and a small public model (downloaded OUTSIDE the sandbox)
        run: |
          pip install -e kit -e "core[dev]" mlx-lm huggingface_hub
          python -c "from huggingface_hub import snapshot_download; print(snapshot_download('mlx-community/SmolLM-135M-Instruct-4bit', local_dir='/tmp/atlas-model'))"
          ls -la /tmp/atlas-model
      - name: Discover which Mach services MLX/Metal needs under a deny-all-lookups profile
        continue-on-error: true
        working-directory: core
        run: |
          cat > /tmp/mach_discover.py <<'PY'
          import os, re, subprocess, sys
          from atlas_core import sandbox
          code = "import mlx_lm; m, t = mlx_lm.load('/tmp/atlas-model'); print('GEN', repr(''.join(getattr(r, 'text', '') for r in mlx_lm.stream_generate(m, t, prompt='Hello', max_tokens=4))))"
          allowed: list[str] = []
          for round_ in range(1, 9):
              base = sandbox.mac_profile(["/tmp/atlas-model"])
              base = base[: base.index("(deny mach-lookup")]
              allow = "(allow mach-lookup " + "".join(f'(global-name "{n}")' for n in allowed) + ")" if allowed else ""
              profile = base + "(deny mach-lookup (with report))" + allow
              proc = subprocess.Popen(["/usr/bin/sandbox-exec", "-p", profile, sys.executable, "-c", code], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, cwd="/", env={**os.environ, "HF_HUB_OFFLINE": "1"})
              out, _ = proc.communicate(timeout=180)
              log = subprocess.run(["log", "show", "--last", "2m", "--style", "compact", "--predicate", 'eventMessage CONTAINS "mach-lookup"'], capture_output=True, text=True).stdout
              found = sorted({m for pid, m in re.findall(r"\((\d+)\) deny\(\d+\) mach-lookup (\S+)", log) if int(pid) == proc.pid} - set(allowed))
              ok = proc.returncode == 0 and b"GEN" in out
              print(f"round {round_}: rc={proc.returncode} ok={ok} new={found}")
              if ok:
                  break
              if not found:
                  print("no new services reported; output tail:", out[-300:].decode("utf-8", "replace").replace("\n", " | "))
                  break
              allowed += found
          print("FINAL", allowed)
          PY
          python /tmp/mach_discover.py > /tmp/mach.out 2>&1 || true
          cat /tmp/mach.out | cut -c1-900
      - name: Real MLX inference inside the sandboxed worker
        working-directory: core
        env:
          ATLAS_MLX_MODEL_DIR: /tmp/atlas-model
        run: pytest -q -p no:cacheprovider tests/test_mlx_native.py tests/test_isolated.py
      - name: Mach discovery result (temporarily fails the job so the log can be read)
        if: always()
        run: |
          head -14 /tmp/mach.out | cut -c1-1200
          exit 1
  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e "../kit[secure]" -e ".[secure]" -e "../library[parse]" bandit pip-audit cyclonedx-bom
      - run: bandit -q -r src ../kit/src ../library/src -c pyproject.toml
      - run: bandit -q -r ../images/src -c ../images/pyproject.toml -ll
      - run: pip-audit
      - run: cyclonedx-py environment -o sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: finance/sbom.json
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

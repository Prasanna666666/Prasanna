name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finance
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e "../kit[secure]" -e ".[secure,dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest -q --cov=finance --cov-fail-under=85
  kit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[secure,dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest -q
  images:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: images
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e "../kit[secure]" -e ".[dev]"  # the encryption tests need SQLCipher
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest -q
  library:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: library
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr
      - run: pip install -e "../kit[secure]" -e "../images" -e "../finance" -e ".[parse,dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest -q
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes eslint@10.1.0 src/finance/static
      - run: npx --yes prettier@3.8.1 --check src/finance/static
      - run: npx --yes eslint@10.1.0 ../library/src/library/static
      - run: npx --yes prettier@3.8.1 --check ../design
      - run: npx --yes prettier@3.8.1 --check ../library/src/library/static
  atlas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atlas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -e "../kit" -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest -q
      - run: npx --yes eslint@10.1.0 src/atlas/static
      - run: npx --yes prettier@3.8.1 --check src/atlas/static
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e "../kit[secure]" -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest -q
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Swift app builds and its tests pass
        working-directory: app
        run: |
          swift --version
          swift build
          swift test
      - name: Install SQLCipher and build its Python binding from source (no macOS wheel exists)
        run: |
          brew install sqlcipher
          prefix="$(brew --prefix sqlcipher)"
          export CFLAGS="-I$prefix/include -I$prefix/include/sqlcipher"
          export LDFLAGS="-L$prefix/lib"
          pip install sqlcipher3
      - run: pip install -e kit -e "core[dev]"
      - name: Core tests on macOS
        working-directory: core
        run: pytest -q -p no:cacheprovider
  macos-mlx:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the real MLX library and a small public model (downloaded OUTSIDE the sandbox)
        run: |
          pip install -e kit -e "core[dev]" mlx-lm huggingface_hub
          python -c "from huggingface_hub import snapshot_download; print(snapshot_download('mlx-community/SmolLM-135M-Instruct-4bit', local_dir='/tmp/atlas-model'))"
          ls -la /tmp/atlas-model
      - name: Real MLX inference inside the sandboxed worker
        working-directory: core
        env:
          ATLAS_MLX_MODEL_DIR: /tmp/atlas-model
        run: pytest -q -p no:cacheprovider tests/test_mlx_native.py tests/test_isolated.py
  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e "../kit[secure]" -e ".[secure]" -e "../library[parse]" bandit pip-audit cyclonedx-bom
      - run: bandit -q -r src ../kit/src ../library/src -c pyproject.toml
      - run: bandit -q -r ../images/src -c ../images/pyproject.toml -ll
      - run: pip-audit
      - run: cyclonedx-py environment -o sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: finance/sbom.json
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

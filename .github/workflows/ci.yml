name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finance
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e "../kit[secure]" -e ".[secure,dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest -q --cov=finance --cov-fail-under=85
  kit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[secure,dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest -q
  images:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: images
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e "../kit[secure]" -e ".[dev]"  # the encryption tests need SQLCipher
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest -q
  library:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: library
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr
      - run: pip install -e "../kit[secure]" -e "../images" -e "../finance" -e ".[parse,dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest -q
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes eslint@10.1.0 src/finance/static
      - run: npx --yes prettier@3.8.1 --check src/finance/static
      - run: npx --yes eslint@10.1.0 ../library/src/library/static
      - run: npx --yes prettier@3.8.1 --check ../design
      - run: npx --yes prettier@3.8.1 --check ../library/src/library/static
  atlas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atlas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -e "../kit" -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest -q
      - run: npx --yes eslint@10.1.0 src/atlas/static
      - run: npx --yes prettier@3.8.1 --check src/atlas/static
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e "../kit[secure]" -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - name: Install the browser the engine drives (Playwright Chromium)
        run: python -m playwright install --with-deps chromium
      - name: Tests (log and JUnit report saved for the artefact scan)
        run: |
          mkdir -p ../artefacts
          pytest -q --junitxml=../artefacts/junit-${{ matrix.python }}.xml 2>&1 | tee ../artefacts/pytest-${{ matrix.python }}.log
      - name: Scan the test artefacts for personal-content sentinels
        run: python tools/scan_artefacts.py ../artefacts
      - uses: actions/upload-artifact@v4
        with:
          name: core-test-artefacts-${{ matrix.python }}
          path: artefacts
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install SQLCipher and build its Python binding from source (no macOS wheel exists)
        run: |
          brew install sqlcipher
          prefix="$(brew --prefix sqlcipher)"
          export CFLAGS="-I$prefix/include -I$prefix/include/sqlcipher"
          export LDFLAGS="-L$prefix/lib"
          pip install sqlcipher3
      - run: pip install -e kit -e "core[dev,macos]"  # the real Calendar, Contacts and Photos frameworks
      - name: Install the browser the engine drives (Playwright Chromium)
        run: python -m playwright install chromium
      - name: Swift app builds and its tests pass (including the real Swift launcher and client against the real Core)
        working-directory: app
        run: |
          swift --version
          swift build
          ATLAS_CI_PYTHON="$(which python)" swift test
      - name: Core tests on macOS
        working-directory: core
        run: pytest -q -p no:cacheprovider
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Xcode project and build the phone app for the iOS simulator (unsigned)
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project AtlasPhone.xcodeproj -scheme AtlasPhone -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Run the accessibility audit and keep screenshots (iOS simulator)
        working-directory: ios
        run: |
          udid="$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if 'iPhone' in x['name']))")"
          xcodebuild test -project AtlasPhone.xcodeproj -scheme AtlasPhone -destination "id=$udid" CODE_SIGNING_ALLOWED=NO -resultBundlePath "$PWD/phone-ui.xcresult"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone-ui-results
          path: ios/phone-ui.xcresult
          if-no-files-found: warn
  mac-ui:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install SQLCipher and the Core (the app starts its real Core)
        run: |
          brew install sqlcipher
          prefix="$(brew --prefix sqlcipher)"
          export CFLAGS="-I$prefix/include -I$prefix/include/sqlcipher"
          export LDFLAGS="-L$prefix/lib"
          pip install sqlcipher3
          pip install -e kit -e "core[macos]"
      - name: Run the accessibility audit on the Mac app and keep a screenshot
        working-directory: app/xcode
        run: |
          brew install xcodegen
          xcodegen generate
          TEST_RUNNER_ATLAS_CI_PYTHON="$(which python)" ATLAS_CI_PYTHON="$(which python)" xcodebuild test -project AtlasMac.xcodeproj -scheme AtlasMac -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO -resultBundlePath "$PWD/mac-ui.xcresult"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-ui-results
          path: app/xcode/mac-ui.xcresult
          if-no-files-found: warn
  macos-mlx:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the real MLX library and a small public model (downloaded OUTSIDE the sandbox)
        run: |
          pip install -e kit -e "core[dev]" mlx-lm huggingface_hub
          python -c "from huggingface_hub import snapshot_download; print(snapshot_download('mlx-community/SmolLM-135M-Instruct-4bit', local_dir='/tmp/atlas-model'))"
          ls -la /tmp/atlas-model
      - name: Real MLX inference inside the sandboxed worker
        working-directory: core
        env:
          ATLAS_MLX_MODEL_DIR: /tmp/atlas-model
        run: pytest -q -p no:cacheprovider tests/test_mlx_native.py tests/test_isolated.py
  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build Atlas.app (Swift app plus a private Python with the Core inside it)
        run: |
          brew install sqlcipher
          scripts/package_mac.sh "$PWD/build/Atlas.app"
          ls -la build/Atlas.app/Contents/MacOS build/Atlas.app/Contents/Resources
      - name: Launch the app, check it starts its Core and stops it on quit
        run: |
          support="$HOME/Library/Application Support/Atlas"
          rm -rf "$support"
          build/Atlas.app/Contents/MacOS/Atlas > /tmp/atlas-app.log 2>&1 &
          app=$!
          for i in $(seq 1 60); do [ -S "$support/run/core.sock" ] && break; sleep 1; done
          [ -S "$support/run/core.sock" ] || { echo "the app did not start its Core"; cat /tmp/atlas-app.log; ps aux | grep -i atlas | head; exit 1; }
          core=$(cat "$support/run/core.pid")
          echo "app pid $app, core pid $core"
          sleep 4
          screencapture -x /tmp/atlas-launch.png || echo "no screen to capture"
          kill -0 "$core" || { echo "core not running"; exit 1; }
          kill -TERM "$app"
          for i in $(seq 1 20); do kill -0 "$core" 2>/dev/null || break; sleep 1; done
          if kill -0 "$core" 2>/dev/null; then echo "the Core outlived the app"; exit 1; fi
          echo "the app started its Core and the Core stopped with the app"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-app-launch-screenshot
          path: /tmp/atlas-launch.png
          if-no-files-found: warn
      - name: Package the app for download
        run: ditto -c -k --keepParent build/Atlas.app Atlas-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Atlas-app-unsigned
          path: Atlas-unsigned.zip
  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e "../kit[secure]" -e ".[secure]" -e "../library[parse]" bandit pip-audit cyclonedx-bom
      - run: bandit -q -r src ../kit/src ../library/src -c pyproject.toml
      - run: bandit -q -r ../images/src -c ../images/pyproject.toml -ll
      - run: pip-audit
      - run: cyclonedx-py environment -o sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: finance/sbom.json
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

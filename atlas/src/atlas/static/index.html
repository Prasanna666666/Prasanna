<!doctype html>
<html lang="en" data-theme="light">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="color-scheme" content="light dark" />
        <title>Atlas</title>
        <link rel="icon" href="/_atlas/static/icon.svg" type="image/svg+xml" />
        <link rel="stylesheet" href="/_atlas/static/atlas.css" />
        <link rel="stylesheet" href="/_atlas/static/design.css" />
    </head>
    <body>
        <div class="shell">
            <aside class="rail" id="rail" aria-label="Main">
                <a class="brand" href="#/" aria-label="Atlas"><span class="logo"></span><b>Atlas</b></a>
                <nav id="nav"></nav>
                <button class="theme" id="theme" type="button" aria-label="Change theme"></button>
            </aside>
            <div class="col">
                <header class="top">
                    <button class="searchbar" id="search-btn" type="button" aria-label="Search everything">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14ZM21 21l-4.3-4.3" />
                        </svg>
                        <span>Search or ask…</span>
                        <kbd>&#8984;K</kbd>
                    </button>
                    <div class="chips" id="chips" role="status" aria-live="polite"></div>
                    <button class="update" id="update" type="button" aria-label="Read new files, mail and photos">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5" /></svg
                        ><span>Read new files</span>
                    </button>
                </header>
                <main class="stage" id="stage" tabindex="-1"></main>
            </div>
        </div>
        <section class="achat" id="achat" hidden aria-label="Chat with Atlas">
            <header class="achat-head">
                <span class="logo mini" aria-hidden="true"></span>
                <div class="grow">
                    <b>Atlas</b>
                    <div class="faint">Private · one assistant for everything</div>
                </div>
                <button class="ghost" id="achat-new" type="button">New chat</button>
                <button class="ghost" id="achat-close" type="button" aria-label="Close">&times;</button>
            </header>
            <div class="achat-scroll" id="achat-scroll"><div id="achat-thread"></div></div>
            <form class="achat-foot" id="achat-form" autocomplete="off">
                <textarea
                    id="achat-input"
                    rows="1"
                    maxlength="2000"
                    placeholder="Ask about money, photos, anything…"
                    aria-label="Message"
                ></textarea>
                <button id="achat-send" type="submit" aria-label="Send">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" /></svg>
                </button>
            </form>
        </section>
        <section class="scan" id="scan" hidden aria-live="polite" aria-label="Reading progress"></section>
        <button class="fab" id="fab" type="button" aria-label="Ask">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l1-4.2A8 8 0 1 1 20 12Z" /></svg
            ><span>Ask</span>
        </button>
        <script src="/_atlas/static/atlas.js" defer></script>
    </body>
</html>

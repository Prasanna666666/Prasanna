# Aperture, sandboxed in Docker. Photos are mounted READ-ONLY; the app has NO route to the internet, ever:
# the container is on an internal network only, and APERTURE_NEVER_ONLINE=1 blocks network use inside the code.
# There is no download job here. Get the models once with the normal install (scripts/install.sh) and reuse them.
#   private - internal network: aperture + the Ollama bridge + gateway. No internet.
# Set the drive path if it is not /Volumes/Expansion:  APERTURE_HOST_DRIVE=/Volumes/MyDrive docker compose -f docker-compose.aperture.yml up -d
# Prereq (Mac): Ollama installed natively (`ollama pull ministral-3:3b`), listening on 127.0.0.1:11434.
name: aperture

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

x-drive: &drive
  # The container sees the drive at the same path Aperture expects. A tmpfs is the "drive" root; the real folders
  # are mounted into it, so nothing else on your drive is visible to the container.
  # EVERYTHING Aperture learns about your photos (index, GPS, faces, text, labels, thumbnails, previews) lives in the named volume
  # `library-pictures` (the Documents service's indexer fills it; Photos opens the same one): inside Docker's own disk image, not a folder on your Mac, so no program on the Mac (and no assistant) can browse it.
  - library-pictures:/Volumes/Expansion/Aperture/data
  - ${APERTURE_HOST_DRIVE:-/Volumes/Expansion}/Aperture/models:/Volumes/Expansion/Aperture/models:ro
  - ${APERTURE_HOST_DRIVE:-/Volumes/Expansion}/Aperture_Exports:/Volumes/Expansion/Aperture_Exports
  - ${APERTURE_HOST_DRIVE:-/Volumes/Expansion}/Photos:/Volumes/Expansion/Photos:ro

services:
  aperture:
    <<: *hardened
    build: {context: .., dockerfile: photos/Dockerfile.aperture}
    image: aperture:local
    tmpfs: ["/tmp", "/Volumes/Expansion"]
    volumes: *drive
    environment:
      APERTURE_LIBRARY_URL: http://library.internal:8502   # Update is passed on to Documents, whose sealed indexer reads the pictures
      APERTURE_TRUSTED_HOSTS: ollama,library.internal
    networks: [private]
    depends_on: [ollama, library]
    mem_limit: 5g   # leave room for macOS and Ollama on an 8 GB Mac

  gateway:   # shows the UI on this computer only (127.0.0.1:8765); forwards bytes, runs no app code
    <<: *hardened
    image: alpine/socat:1.8.0.0
    command: TCP-LISTEN:8765,fork,reuseaddr TCP:aperture:8765
    ports: ["127.0.0.1:8765:8765"]
    networks: [private, default]
    depends_on: [aperture]

  library:   # forwards ONLY to the Documents service on this Mac (port 8502)
    <<: *hardened
    image: alpine/socat:1.8.0.0
    command: TCP-LISTEN:8502,fork,reuseaddr TCP:host.docker.internal:8502
    networks:
      private: {aliases: [library.internal]}
      default: {}

  ollama:    # named `ollama` so Aperture finds it; forwards ONLY to Ollama running on the Mac
    <<: *hardened
    image: alpine/socat:1.8.0.0
    command: TCP-LISTEN:11434,fork,reuseaddr TCP:host.docker.internal:11434
    networks: [private, default]

volumes:
  library-pictures:
    external: true   # created by the Documents service (library/scripts/up.sh); start that first
    name: library-pictures

networks:
  private: {internal: true}

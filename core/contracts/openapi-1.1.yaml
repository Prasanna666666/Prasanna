# API 1.1 specification (additive over the frozen 1.0). Hand-maintained from here on; derived once from openapi.yaml, which is not changed.
openapi: 3.1.0
info:
  title: Atlas Core API
  version: '1.1'
  summary: API 1.1 (specification of the additive delta over the frozen 1.0). Version negotiation is explicit; the Core still serves 1.0 only.
  description: 'Language-neutral source of truth, with atlas-contracts.schema.json. A client is never trusted: the Core enforces

    the source policy before retrieval and before any model context is built. Every request is signed by a per-client key

    (no localhost or Origin trust). Remote iOS connectivity is NOT specified here (G-O14); the same signed-request scheme is

    the seam a remote transport would reuse.


    Version 1.1 is validated only against atlas-contracts.1.1.schema.json (the 1.0 document with the 1.1 delta applied by contracts.build_1_1). The 1.0 files are
    frozen and unchanged.

    The operations marked x-atlas-status are specification only: no route serves them yet. Hand-maintained; it was derived once from openapi.yaml.

    '
servers:
- url: unix:///run/atlas/core.sock
  description: Local transport (Unix domain socket, owner-only, peer-credential checked).
security:
- SignedRequest: []
paths:
  /v1/version:
    get:
      operationId: getVersion
      summary: Version negotiation. The only call that does not need a supported X-Atlas-Api-Version.
      responses:
        '200':
          description: Versions this Core speaks
          content:
            application/json:
              schema:
                $ref: ./atlas-contracts.schema.json#/$defs/ApiVersion
        '401':
          $ref: '#/components/responses/Error'
  /v1/tasks:
    post:
      operationId: createTask
      requestBody:
        content:
          application/json:
            schema:
              $ref: ./atlas-contracts.1.1.schema.json#/$defs/TaskRequest
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: ./atlas-contracts.1.1.schema.json#/$defs/TaskRecord
          description: Same idempotency key and same request returned the existing task
          headers: &id001
            X-Atlas-Api-Version:
              $ref: '#/components/headers/ApiVersionEcho'
        '201':
          content:
            application/json:
              schema:
                $ref: ./atlas-contracts.1.1.schema.json#/$defs/TaskRecord
          description: Task created
          headers: *id001
        '400':
          $ref: '#/components/responses/ErrorVersioned'
        '401':
          $ref: '#/components/responses/ErrorVersioned'
        '403':
          $ref: '#/components/responses/ErrorVersioned'
        '409':
          $ref: '#/components/responses/ErrorVersioned'
        '426':
          $ref: '#/components/responses/ErrorVersioned'
      summary: Create a task (idempotent on idempotency_key). The source policy is evaluated before anything is retrieved.
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
  /v1/tasks/{task_id}:
    get:
      operationId: getTask
      parameters:
      - $ref: '#/components/parameters/TaskId'
      - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: ./atlas-contracts.1.1.schema.json#/$defs/TaskRecord
          description: The task
          headers: *id001
        '401':
          $ref: '#/components/responses/ErrorVersioned'
        '404':
          $ref: '#/components/responses/ErrorVersioned'
  /v1/tasks/{task_id}/cancel:
    post:
      operationId: cancelTask
      parameters:
      - $ref: '#/components/parameters/TaskId'
      - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: ./atlas-contracts.1.1.schema.json#/$defs/TaskRecord
          description: The task after the request
          headers: *id001
        '401':
          $ref: '#/components/responses/ErrorVersioned'
        '404':
          $ref: '#/components/responses/ErrorVersioned'
      summary: Request cancellation. Honoured at the next step boundary; always safe to repeat.
  /v1/tasks/{task_id}/answer:
    get:
      operationId: getAnswer
      parameters:
      - $ref: '#/components/parameters/TaskId'
      - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: ./atlas-contracts.1.1.schema.json#/$defs/AnswerEnvelope
          description: The answer
          headers: *id001
        '401':
          $ref: '#/components/responses/ErrorVersioned'
        '404':
          $ref: '#/components/responses/ErrorVersioned'
        '409':
          $ref: '#/components/responses/ErrorVersioned'
      summary: The answer envelope of a finished task.
  /v1/tasks/{task_id}/receipt:
    get:
      operationId: getReceipt
      parameters:
      - $ref: '#/components/parameters/TaskId'
      - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: ./atlas-contracts.1.1.schema.json#/$defs/ExecutionReceipt
          description: The receipt
          headers: *id001
        '401':
          $ref: '#/components/responses/ErrorVersioned'
        '404':
          $ref: '#/components/responses/ErrorVersioned'
        '409':
          $ref: '#/components/responses/ErrorVersioned'
      summary: The execution receipt of a finished task (audit envelope only; this slice has no actions).
  /v1/tasks/{task_id}/events:
    get:
      operationId: streamEvents
      parameters:
      - $ref: '#/components/parameters/TaskId'
      - in: query
        name: after
        required: false
        schema:
          minimum: 0
          type: integer
      - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          content:
            text/event-stream:
              schema:
                description: 'Lines ''id: <seq>'' and ''data: <StreamEvent JSON>'''
                type: string
          description: Event stream
          headers: *id001
        '401':
          $ref: '#/components/responses/ErrorVersioned'
        '404':
          $ref: '#/components/responses/ErrorVersioned'
      summary: Progress and state as Server-Sent Events; each data line is one StreamEvent. Resume with ?after=<seq>.
  /v1/consent:
    get:
      operationId: getConsent
      summary: The grants the owner has made and, per source, whether macOS access is granted. Only an owner-interactive client may call it (text only in WP3.1).
      x-atlas-status: served by the Core since WP3.4 (consent routes need an enrolled owner client)
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: The consent state
          headers: *id001
          content:
            application/json:
              schema:
                $ref: ./atlas-contracts.1.1.schema.json#/$defs/ConsentState
        '401':
          $ref: '#/components/responses/ErrorVersioned'
        '403':
          $ref: '#/components/responses/ErrorVersioned'
        '404':
          $ref: '#/components/responses/ErrorVersioned'
    post:
      operationId: createConsent
      summary: 'The single Get Started consent: enable the listed source types. Only an owner-interactive client may call it (text only in WP3.1).'
      x-atlas-status: served by the Core since WP3.4 (consent routes need an enrolled owner client)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./atlas-contracts.1.1.schema.json#/$defs/ConsentRequest
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      responses:
        '201':
          description: The consent state after the request
          headers: *id001
          content:
            application/json:
              schema:
                $ref: ./atlas-contracts.1.1.schema.json#/$defs/ConsentState
        '401':
          $ref: '#/components/responses/ErrorVersioned'
        '403':
          $ref: '#/components/responses/ErrorVersioned'
        '404':
          $ref: '#/components/responses/ErrorVersioned'
  /v1/consent/{grant_id}:
    delete:
      operationId: revokeConsent
      summary: Revoke one grant, effective at the next read or model boundary. Only an owner-interactive client may call it (text only in WP3.1).
      x-atlas-status: served by the Core since WP3.4 (consent routes need an enrolled owner client)
      parameters:
      - $ref: '#/components/parameters/GrantId'
      - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: The consent state after the revocation
          headers: *id001
          content:
            application/json:
              schema:
                $ref: ./atlas-contracts.1.1.schema.json#/$defs/ConsentState
        '401':
          $ref: '#/components/responses/ErrorVersioned'
        '403':
          $ref: '#/components/responses/ErrorVersioned'
        '404':
          $ref: '#/components/responses/ErrorVersioned'
  /v1/tasks/{task_id}/citations/{index}:
    get:
      operationId: getCitationPassage
      summary: The text of one cited span of a finished task's answer, so the owner can inspect a citation. Fails closed when a source is no longer permitted or the span no longer resolves exactly.
      x-atlas-status: served by the Core since WP3.4 (consent routes need an enrolled owner client)
      parameters:
      - $ref: '#/components/parameters/TaskId'
      - $ref: '#/components/parameters/CitationIndex'
      - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: The cited passage
          headers: *id001
          content:
            application/json:
              schema:
                $ref: ./atlas-contracts.1.1.schema.json#/$defs/PassageText
        '401':
          $ref: '#/components/responses/ErrorVersioned'
        '403':
          $ref: '#/components/responses/ErrorVersioned'
        '404':
          $ref: '#/components/responses/ErrorVersioned'
        '409':
          $ref: '#/components/responses/ErrorVersioned'
  /v1/compute:
    post:
      operationId: compute
      summary: A typed, deterministic computation (exact arithmetic, unit conversion, date arithmetic) done by code. Reads no source.
      x-atlas-status: served by the Core since WP3.4 (consent routes need an enrolled owner client)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./atlas-contracts.1.1.schema.json#/$defs/ComputeRequest
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: The exact result
          headers: *id001
          content:
            application/json:
              schema:
                $ref: ./atlas-contracts.1.1.schema.json#/$defs/ComputeResult
        '400':
          $ref: '#/components/responses/ErrorVersioned'
        '401':
          $ref: '#/components/responses/ErrorVersioned'
        '404':
          $ref: '#/components/responses/ErrorVersioned'
  /v1/tasks/{task_id}/research:
    post:
      operationId: research
      summary: A public web search made on behalf of one task, through the Core's egress gateway. Off by default (explicit live-network gate); the result is untrusted data with provenance and never evidence.
      x-atlas-status: served by the Core behind a disabled-by-default gate (WP3 close-out); real-Internet use is a final-stage gate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./atlas-contracts.1.1.schema.json#/$defs/ResearchRequest
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - name: task_id
        in: path
        required: true
        schema:
          $ref: ./atlas-contracts.1.1.schema.json#/$defs/Opaque
      responses:
        '200':
          description: Public content as untrusted data
          headers: *id001
          content:
            application/json:
              schema:
                $ref: ./atlas-contracts.1.1.schema.json#/$defs/ResearchResult
        '400':
          $ref: '#/components/responses/ErrorVersioned'
        '401':
          $ref: '#/components/responses/ErrorVersioned'
        '403':
          $ref: '#/components/responses/ErrorVersioned'
        '404':
          $ref: '#/components/responses/ErrorVersioned'
        '504':
          $ref: '#/components/responses/ErrorVersioned'
  /v1/actions:
    post:
      operationId: proposeAction
      summary: Propose one typed action as the owner; approval only for PRD 4.4's four categories.
      x-atlas-status: served by the Core when it is configured with the owner's edits store (Stages 5 and 6); API 1.1 additive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./atlas-contracts.1.1.schema.json#/$defs/ActionRequest
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: The result
          headers: *id001
          content:
            application/json:
              schema:
                $ref: ./atlas-contracts.1.1.schema.json#/$defs/ActionOutcome
        '400':
          $ref: '#/components/responses/ErrorVersioned'
        '401':
          $ref: '#/components/responses/ErrorVersioned'
        '403':
          $ref: '#/components/responses/ErrorVersioned'
        '404':
          $ref: '#/components/responses/ErrorVersioned'
  /v1/actions/approve:
    post:
      operationId: approveAction
      summary: The owner approves one pending approval id (single-use, bound to the exact payload).
      x-atlas-status: served by the Core when it is configured with the owner's edits store (Stages 5 and 6); API 1.1 additive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./atlas-contracts.1.1.schema.json#/$defs/ApprovalRequest
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: The result
          headers: *id001
          content:
            application/json:
              schema:
                $ref: ./atlas-contracts.1.1.schema.json#/$defs/ApprovalResult
        '400':
          $ref: '#/components/responses/ErrorVersioned'
        '401':
          $ref: '#/components/responses/ErrorVersioned'
        '403':
          $ref: '#/components/responses/ErrorVersioned'
        '404':
          $ref: '#/components/responses/ErrorVersioned'
  /v1/actions/undo:
    post:
      operationId: undoAction
      summary: Undo one completed reversible action.
      x-atlas-status: served by the Core when it is configured with the owner's edits store (Stages 5 and 6); API 1.1 additive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./atlas-contracts.1.1.schema.json#/$defs/UndoRequest
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: The result
          headers: *id001
          content:
            application/json:
              schema:
                $ref: ./atlas-contracts.1.1.schema.json#/$defs/ActionOutcome
        '400':
          $ref: '#/components/responses/ErrorVersioned'
        '401':
          $ref: '#/components/responses/ErrorVersioned'
        '403':
          $ref: '#/components/responses/ErrorVersioned'
        '404':
          $ref: '#/components/responses/ErrorVersioned'
  /v1/sync:
    post:
      operationId: syncOperations
      summary: Apply a device's offline queue, once each and in order; conflicts are reported and never overwritten.
      x-atlas-status: served by the Core when it is configured with the owner's edits store (Stages 5 and 6); API 1.1 additive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./atlas-contracts.1.1.schema.json#/$defs/SyncRequest
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: The result
          headers: *id001
          content:
            application/json:
              schema:
                $ref: ./atlas-contracts.1.1.schema.json#/$defs/SyncResult
        '400':
          $ref: '#/components/responses/ErrorVersioned'
        '401':
          $ref: '#/components/responses/ErrorVersioned'
        '403':
          $ref: '#/components/responses/ErrorVersioned'
        '404':
          $ref: '#/components/responses/ErrorVersioned'
  /v1/devices/offer:
    post:
      operationId: openPairingOffer
      summary: An owner client opens a pairing offer for a new device.
      x-atlas-status: served by the Core (Stage 8, Core side); API 1.1 additive
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: The result
          headers: *id001
          content:
            application/json:
              schema:
                $ref: ./atlas-contracts.1.1.schema.json#/$defs/DeviceOffer
        '400':
          $ref: '#/components/responses/ErrorVersioned'
        '401':
          $ref: '#/components/responses/ErrorVersioned'
        '403':
          $ref: '#/components/responses/ErrorVersioned'
        '404':
          $ref: '#/components/responses/ErrorVersioned'
  /v1/devices/pair:
    post:
      operationId: pairDevice
      summary: A new device pairs with the offer code and its public key (unsigned, like first enrolment).
      x-atlas-status: served by the Core (Stage 8, Core side); API 1.1 additive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./atlas-contracts.1.1.schema.json#/$defs/PairRequest
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: The result
          headers: *id001
          content:
            application/json:
              schema:
                $ref: ./atlas-contracts.1.1.schema.json#/$defs/PairResult
        '400':
          $ref: '#/components/responses/ErrorVersioned'
        '401':
          $ref: '#/components/responses/ErrorVersioned'
        '403':
          $ref: '#/components/responses/ErrorVersioned'
        '404':
          $ref: '#/components/responses/ErrorVersioned'
  /v1/devices:
    get:
      operationId: listDevices
      summary: The owner lists paired devices.
      x-atlas-status: served by the Core (Stage 8, Core side); API 1.1 additive
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: The result
          headers: *id001
          content:
            application/json:
              schema:
                $ref: ./atlas-contracts.1.1.schema.json#/$defs/DeviceList
        '400':
          $ref: '#/components/responses/ErrorVersioned'
        '401':
          $ref: '#/components/responses/ErrorVersioned'
        '403':
          $ref: '#/components/responses/ErrorVersioned'
        '404':
          $ref: '#/components/responses/ErrorVersioned'
  /v1/devices/revoke:
    post:
      operationId: revokeDevice
      summary: The owner revokes a device.
      x-atlas-status: served by the Core (Stage 8, Core side); API 1.1 additive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./atlas-contracts.1.1.schema.json#/$defs/RevokeRequest
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: The result
          headers: *id001
          content:
            application/json:
              schema:
                $ref: ./atlas-contracts.1.1.schema.json#/$defs/RevokeResult
        '400':
          $ref: '#/components/responses/ErrorVersioned'
        '401':
          $ref: '#/components/responses/ErrorVersioned'
        '403':
          $ref: '#/components/responses/ErrorVersioned'
        '404':
          $ref: '#/components/responses/ErrorVersioned'
  /v1/library/search:
    post:
      operationId: librarySearch
      summary: Search the sources the owner has enabled, through the same policy and retrieval path as a question.
      x-atlas-status: served by the Core (Library surface); API 1.1 additive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./atlas-contracts.1.1.schema.json#/$defs/LibrarySearchRequest
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: The results and the coverage of each source
          headers: *id001
          content:
            application/json:
              schema:
                $ref: ./atlas-contracts.1.1.schema.json#/$defs/LibraryResult
        '400':
          $ref: '#/components/responses/ErrorVersioned'
        '401':
          $ref: '#/components/responses/ErrorVersioned'
        '403':
          $ref: '#/components/responses/ErrorVersioned'
        '404':
          $ref: '#/components/responses/ErrorVersioned'
  /v1/attention:
    get:
      operationId: attention
      summary: What needs the owner's attention, computed by code from the owner's own records.
      x-atlas-status: served by the Core when it is configured with the owner's edits store; API 1.1 additive
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: The items that need attention (possibly none)
          headers: *id001
          content:
            application/json:
              schema:
                $ref: ./atlas-contracts.1.1.schema.json#/$defs/AttentionList
        '401':
          $ref: '#/components/responses/ErrorVersioned'
        '403':
          $ref: '#/components/responses/ErrorVersioned'
        '404':
          $ref: '#/components/responses/ErrorVersioned'
  /v1/records/{domain}:
    get:
      operationId: listRecords
      summary: The owner's own records of one domain (calendar, contacts or notes).
      x-atlas-status: served by the Core when it is configured with the owner's edits store; API 1.1 additive
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - name: domain
        in: path
        required: true
        schema:
          type: string
          enum: [calendar, contacts, notes]
      responses:
        '200':
          description: The records
          headers: *id001
          content:
            application/json:
              schema:
                $ref: ./atlas-contracts.1.1.schema.json#/$defs/RecordList
        '401':
          $ref: '#/components/responses/ErrorVersioned'
        '403':
          $ref: '#/components/responses/ErrorVersioned'
        '404':
          $ref: '#/components/responses/ErrorVersioned'
  /v1/enrol:
    post:
      operationId: enrolClient
      summary: Enrol a client by its public key. The first owner client may enrol itself once, unsigned, over the owner-only socket; afterwards only a signed owner client may enrol a member.
      x-atlas-status: served by the Core since WP3.4 (consent routes need an enrolled owner client)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./atlas-contracts.1.1.schema.json#/$defs/EnrolRequest
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      responses:
        '201':
          description: The client is enrolled
          headers: *id001
          content:
            application/json:
              schema:
                $ref: ./atlas-contracts.1.1.schema.json#/$defs/EnrolResponse
        '400':
          $ref: '#/components/responses/ErrorVersioned'
        '401':
          $ref: '#/components/responses/ErrorVersioned'
        '403':
          $ref: '#/components/responses/ErrorVersioned'
        '409':
          $ref: '#/components/responses/ErrorVersioned'
  /v1/mode:
    get:
      operationId: getMode
      summary: The owner's selected model mode. Only an enrolled owner client may call it.
      x-atlas-status: served by the Core since WP3.4 (consent routes need an enrolled owner client)
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: The mode
          headers: *id001
          content:
            application/json:
              schema:
                $ref: ./atlas-contracts.1.1.schema.json#/$defs/ModeState
        '401':
          $ref: '#/components/responses/ErrorVersioned'
        '403':
          $ref: '#/components/responses/ErrorVersioned'
    post:
      operationId: setMode
      summary: Select the model mode (default or research). Only an enrolled owner client may call it.
      x-atlas-status: served by the Core since WP3.4 (consent routes need an enrolled owner client)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./atlas-contracts.1.1.schema.json#/$defs/ModeState
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: The mode now selected
          headers: *id001
          content:
            application/json:
              schema:
                $ref: ./atlas-contracts.1.1.schema.json#/$defs/ModeState
        '400':
          $ref: '#/components/responses/ErrorVersioned'
        '401':
          $ref: '#/components/responses/ErrorVersioned'
        '403':
          $ref: '#/components/responses/ErrorVersioned'
  /v1/index/status:
    get:
      operationId: getIndexStatus
      summary: 'Counts about the search index: indexed, total, newest indexed, failed. Never content.'
      x-atlas-status: served by the Core since WP3.4 (consent routes need an enrolled owner client)
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: The index status
          headers: *id001
          content:
            application/json:
              schema:
                $ref: ./atlas-contracts.1.1.schema.json#/$defs/IndexStatus
        '401':

components:
  securitySchemes:
    SignedRequest:
      type: apiKey
      in: header
      name: X-Atlas-Signature
      description: "Ed25519 signature, base64, over: METHOD, PATH (with query), X-Atlas-Timestamp, X-Atlas-Nonce and the SHA-256 hex of the body,\njoined by newlines.\
        \ Also required: X-Atlas-Client (registered client id), X-Atlas-Timestamp (seconds), X-Atlas-Nonce (single use).\nA missing, invalid, replayed, stale or revoked\
        \ identity is refused. The optional X-Atlas-Api-Version selects the contract version.\n        API 1.1 signing: when the applied version is 1.1 the signed\
        \ message has SIX fields, joined by LF (0x0A), UTF-8, no trailing newline, in this order:\n        the literal text 1.1, METHOD (uppercase), PATH (with query),\
        \ X-Atlas-Timestamp, X-Atlas-Nonce, the lowercase hex SHA-256 of the body.\n        API 1.0 requests keep the five-field message unchanged. The Core builds\
        \ the message from the version it applies, so a request signed for 1.1\n        whose version header is stripped or changed fails verification. A 1.1 client\
        \ rejects a response whose X-Atlas-Api-Version is absent or differs\n        from the version it requested. /v1/version is the unversioned discovery call:\
        \ it keeps the 1.0 signing and has no echo. Any field containing CR or LF is refused.\n        The consent routes may be called only by an enrolled owner-interactive\
        \ client (specification only; enforcement belongs to a later package)."

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit"
version = "0.1.0"
description = "Private personal assistant: tasks, notes, money, family - one local database, one chat"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ui = []  # kept so older install commands still work; the interface needs no extra packages
secure = ["sqlcipher3-binary>=0.5"]
parse = ["pymupdf>=1.24", "pdfplumber>=0.11", "openpyxl>=3.1", "pillow>=10"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
orbit = "orbit.cli:main"
orbit-parser = "orbit.parser:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orbit = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

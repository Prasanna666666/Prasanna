[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit"
version = "0.1.0"
description = "Private personal assistant: tasks, notes, money, family - one local database, one chat"
requires-python = ">=3.10"
dependencies = []  # and the shared kit (../kit): pip install -e ../kit

[project.optional-dependencies]
ui = []  # kept so older install commands still work; the interface needs no extra packages
secure = ["sqlcipher3-binary>=0.5"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
orbit = "orbit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orbit = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../kit/src"]

[tool.ruff]
line-length = 160
target-version = "py310"
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "DTZ", "C4", "C90", "PIE", "PL", "BLE"]
ignore = [
    "S101",    # assert is used in tests
    "S608",    # SQL is built from column names written in code, never from user input (reviewed)
    "PLR0913", "PLR2004",  # many keyword arguments are normal here; magic numbers in readers are format widths
    "PLC0415", # imports inside functions are deliberate: optional dependencies and the parser container must not load each other
    "PLR0917", # call sites use keywords where it matters
    "E501",    # the formatter owns line length
    "RUF001", "RUF002", "RUF003",  # text deliberately uses typographic characters
]

[tool.ruff.lint.mccabe]
max-complexity = 15   # a function above this is split, not excused

[tool.ruff.lint.pylint]
max-branches = 15
max-returns = 8
max-statements = 50

[tool.ruff.lint.per-file-ignores]
"src/orbit/standards.py" = ["S314"]  # DOCTYPE and entities are refused before parsing
"src/orbit/applenotes.py" = ["S603", "S607", "PLW1510", "S324"]  # osascript with a fixed script; the hash is only an identifier
"src/orbit/statements.py" = ["S324"]  # sha1 is a stable identifier here, not security
"src/orbit/tables.py" = ["DTZ007"]  # statement dates have no time zone
"src/orbit/rates.py" = ["PLW2901"]
"tests/*" = ["S", "DTZ", "PLR", "BLE", "SIM117"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
mypy_path = "src:../kit/src"

[tool.coverage.run]
source = ["src/orbit"]

[tool.bandit]
# Each skip is a reviewed, deliberate pattern, not noise:
#  B404/B603/B607  fixed executables (tesseract, pdftotext, osascript) with list arguments and no shell
#  B310            the model server URL is validated to be local in llm.OllamaClient.__init__
#  B314/B405       XML containing a DOCTYPE or entities is refused before parsing (tests/test_fuzz.py, tests/test_standards.py)
#  B608            SQL is assembled from column names written in the code, never from user input
skips = ["B404", "B603", "B607", "B310", "B314", "B405", "B608"]

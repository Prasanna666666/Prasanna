[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit"
version = "0.1.0"
description = "Private personal assistant: tasks, notes, money, family - one local database, one chat"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ui = ["streamlit>=1.48"]
secure = ["sqlcipher3-binary>=0.5"]
parse = ["pymupdf>=1.24"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
orbit = "orbit.cli:main"
orbit-parser = "orbit.parser:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

# Orbit: offline by design.
#   private - internal network, NO route to the internet. The app lives ONLY here.
#   default - Docker's normal network, used only by the two byte-forwarders below (gateway, ollama bridge):
#             Docker needs it to publish a port and to reach Ollama running on your Mac. They run no app code.
# There is no proxy and no allowlist: nothing in this stack is meant to reach the internet.
# Prereq (Mac): install Ollama and run `ollama pull llama3.2:3b` (needs internet once).
name: orbit

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp"]
  restart: unless-stopped

services:
  app:
    <<: *hardened
    build: .
    image: orbit:local
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes: ["orbit-data:/data"]
    networks: [private]
    depends_on: [ollama]

  # Exposes the UI on this computer only (127.0.0.1). Can reach nothing except app:8501.
  gateway:
    <<: *hardened
    image: alpine/socat:1.8.0.0
    command: TCP-LISTEN:8501,fork,reuseaddr TCP:app:8501
    ports: ["127.0.0.1:8501:8501"]
    networks: [private, default]
    depends_on: [app]

  # Named `ollama` so the app finds it; forwards ONLY to Ollama on the Mac (host.docker.internal:11434).
  ollama:
    <<: *hardened
    image: alpine/socat:1.8.0.0
    command: TCP-LISTEN:11434,fork,reuseaddr TCP:host.docker.internal:11434
    networks: [private, default]

networks:
  private: {internal: true}

volumes:
  orbit-data:

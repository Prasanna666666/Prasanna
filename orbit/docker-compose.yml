# Orbit: offline, encrypted, and split by trust level.
#
#   parser  - opens untrusted files. network_mode: none (no network at all), inbox read-only, writes ONLY to `parsed`.
#   app     - assistant + UI + encrypted database. Internal network (no internet). Sees `parsed` READ-ONLY, has no parser code.
#   gateway / ollama bridge - dumb byte forwarders (UI on 127.0.0.1 only; Ollama on your Mac).
#
# Start with ./scripts/up.sh (it keeps the database key in the macOS Keychain and passes it as a Docker secret).
# Prereq (Mac): Ollama installed natively and `ollama pull ministral-3:3b` (needs internet once).
name: orbit

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp"]
  restart: unless-stopped

services:
  parser:
    <<: *hardened
    build: {context: ., target: parser}
    image: orbit-parser:local
    network_mode: none          # cannot talk to anything, not even the app: the only exchange is files
    environment: {ORBIT_INBOX: /inbox, ORBIT_PARSED: /parsed, ORBIT_FINANCE: /finance}
    volumes:
      - ${HOME}/OrbitInbox:/inbox:ro
      - ${ORBIT_FINANCE_DIR:-${HOME}/OrbitFinance}:/finance:ro   # your bank statements and finance files: read-only, only the parser sees them
      - orbit-parsed:/parsed
    mem_limit: 1g
    pids_limit: 128
    cpus: 1.0

  app:
    <<: *hardened
    build: {context: ., target: app}
    image: orbit:local
    environment:
      OLLAMA_HOST: http://ollama:11434
      ORBIT_INBOX: /inbox
      ORBIT_PARSED: /parsed
      ORBIT_DB_KEY_FILE: /run/secrets/orbit_key
    secrets: [orbit_key]
    volumes:
      - orbit-data:/data
      - orbit-parsed:/parsed:ro   # parser output, read-only
      - ${HOME}/OrbitInbox:/inbox:ro
    networks: [private]
    depends_on: [ollama]
    mem_limit: 1g

  gateway:
    <<: *hardened
    image: alpine/socat:1.8.0.0
    command: TCP-LISTEN:8501,fork,reuseaddr TCP:app:8501
    ports: ["127.0.0.1:8501:8501"]
    networks: [private, default]
    depends_on: [app]

  ollama:   # named `ollama` so the app finds it; forwards ONLY to Ollama on the Mac
    <<: *hardened
    image: alpine/socat:1.8.0.0
    command: TCP-LISTEN:11434,fork,reuseaddr TCP:host.docker.internal:11434
    networks: [private, default]

networks:
  private: {internal: true}

secrets:
  orbit_key:
    environment: ORBIT_DB_KEY    # exported by scripts/up.sh from the Keychain; never written to disk

volumes:
  orbit-data:
  orbit-parsed:

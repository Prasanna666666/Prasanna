<!doctype html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="color-scheme" content="light dark" />
        <meta name="theme-color" content="#6366f1" />
        <title>Finance</title>
        <link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
        <link rel="stylesheet" href="/static/app.css" />
    </head>
    <body>
        <div class="shell">
            <aside class="side">
                <div class="brand"><span class="orb"></span><span class="brand-name">Finance</span></div>
                <nav id="nav" aria-label="Main"></nav>
                <div class="side-foot">
                    <button class="theme" id="theme" type="button" aria-label="Change theme"></button>
                    <div class="pill" id="ai-pill"><span class="dot"></span><span id="ai-text">…</span></div>
                    <div class="private">
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M12 2 4 5v6c0 5 3.4 9.3 8 11 4.6-1.7 8-6 8-11V5l-8-3Zm0 6a2 2 0 0 1 1 3.7V15h-2v-3.3A2 2 0 0 1 12 8Z"
                            /></svg
                        >Private
                    </div>
                </div>
            </aside>
            <div class="col">
                <header class="top">
                    <button class="searchbar" id="search-btn" type="button" aria-label="Search everything">
                        <svg viewBox="0 0 24 24"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14ZM21 21l-4.3-4.3" /></svg
                        ><span>Search payments, shops, files, people…</span><kbd>⌘K</kbd>
                    </button>
                    <span class="status" id="ai-top"></span>
                </header>
                <main class="main" id="main" tabindex="-1"></main>
            </div>
        </div>
        <div class="toasts" id="toasts" aria-live="polite"></div>
        <script src="/static/app.js"></script>
    </body>
</html>

# Adds pictures: the sealed indexer reads your photo folder (read-only) with the shared picture engine, and the service answers from the index.
# scripts/up.sh includes this file when the photo drive is connected. The index lives in the Docker volume `library-pictures`.
x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

x-drive: &drive
  # The container sees the drive at the path the engine expects. A tmpfs is the "drive" root; only these folders are mounted into it.
  - library-pictures:/Volumes/Expansion/Aperture/data
  - ${APERTURE_HOST_DRIVE:-/Volumes/Expansion}/Aperture/models:/Volumes/Expansion/Aperture/models:ro
  - ${APERTURE_HOST_DRIVE:-/Volumes/Expansion}/Photos:/Volumes/Expansion/Photos:ro
  - ${HOME}/AtlasInbox:/Volumes/Expansion/Inbox:ro
  - library-mailpictures:/Volumes/Expansion/MailPictures:ro

services:
  parser:   # pictures that arrive in mail are kept for the picture engine
    environment:
      LIBRARY_PICTURES_IN: /pictures-in
    volumes:
      - library-mailpictures:/pictures-in

  indexer:   # reads the photos: no network at all, photos read-only, writes only the index
    <<: *hardened
    build: {context: .., dockerfile: library/Dockerfile, target: indexer}
    image: library-indexer:local
    network_mode: none
    tmpfs: ["/tmp", "/Volumes/Expansion"]
    volumes: *drive
    environment: &pictures
      LIBRARY_PICTURES_DRIVE: /Volumes/Expansion
      LIBRARY_PHOTOS: /Volumes/Expansion/Photos
      LIBRARY_EXTRA_PICTURES: /Volumes/Expansion/Inbox,/Volumes/Expansion/MailPictures   # pictures dropped in the inbox, and pictures that came in mail
      APERTURE_NEVER_ONLINE: "1"
      APERTURE_SANDBOXED: "1"
      ATLAS_REQUIRE_ENCRYPTION: "1"
      ATLAS_DB_KEY: ${ATLAS_DB_KEY:?run ./scripts/up.sh (it reads the key from the Keychain)}   # the picture index is encrypted too
    mem_limit: 5g   # leave room for macOS and Ollama on an 8 GB Mac
    pids_limit: 256

  app:
    tmpfs: ["/tmp", "/Volumes/Expansion"]
    volumes:
      - library-data:/data
      - library-parsed:/parsed
      - library-pictures:/Volumes/Expansion/Aperture/data
      - ${APERTURE_HOST_DRIVE:-/Volumes/Expansion}/Aperture/models:/Volumes/Expansion/Aperture/models:ro
      # the ONLY place your photos are writable: the service moves, deletes (to a trash folder) and exports pictures when you ask and confirm, always undoable
      - ${APERTURE_HOST_DRIVE:-/Volumes/Expansion}/Photos:/Volumes/Expansion/Photos
      - ${APERTURE_HOST_DRIVE:-/Volumes/Expansion}/Aperture_Exports:/Volumes/Expansion/Aperture_Exports
    environment:
      <<: *pictures
      OLLAMA_HOST: http://ollama.internal:11434
      PLATFORM_KEY: ${PLATFORM_KEY:-}
      ATLAS_PARSED: /parsed
      ATLAS_DB_KEY: ${ATLAS_DB_KEY:?run ./scripts/up.sh (it reads the key from the Keychain)}

volumes:
  library-mailpictures: {}
  library-pictures:
    name: library-pictures   # a fixed name: Photos opens the same volume

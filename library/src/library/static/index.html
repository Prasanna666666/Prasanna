<!doctype html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="color-scheme" content="light dark" />
        <title>Documents</title>
        <link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
        <link rel="stylesheet" href="/static/app.css" />
    </head>
    <body>
        <main>
            <header>
                <h1>Documents</h1>
                <p id="count" class="muted"></p>
            </header>
            <form id="find" role="search">
                <input id="q" type="search" placeholder="Search your files and mail" autocomplete="off" aria-label="Search" />
            </form>
            <nav id="kinds" aria-label="Kinds"></nav>
            <section id="list" aria-live="polite"></section>
            <article id="doc" hidden></article>
        </main>
        <script src="/static/app.js"></script>
    </body>
</html>

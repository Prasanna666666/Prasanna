# An Xcode project for the Mac app, used only to run the system's accessibility audit and take screenshots in CI (the app itself is built and released with SwiftPM and `scripts/package_mac.sh`).
# The project file is generated by `xcodegen`; nothing here is hand-edited or checked in.
name: AtlasMac
options:
  bundleIdPrefix: invalid.atlas
  deploymentTarget:
    macOS: "14.0"
packages:
  Atlas:
    path: ..
targets:
  AtlasMac:
    type: application
    platform: macOS
    sources:
      - path: ../Sources/AtlasApp
    dependencies:
      - package: Atlas
        product: AtlasKit
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Atlas
        LSMinimumSystemVersion: "14.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: invalid.atlas.app
        SWIFT_VERSION: "5.9"
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_HARDENED_RUNTIME: "NO"
  AtlasMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - AtlasMacUITests
    dependencies:
      - target: AtlasMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: invalid.atlas.app.uitests
        SWIFT_VERSION: "5.9"
        CODE_SIGNING_ALLOWED: "NO"
schemes:
  AtlasMac:
    build:
      targets:
        AtlasMac: all
    test:
      targets:
        - AtlasMacUITests
